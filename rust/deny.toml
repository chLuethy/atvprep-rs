[graph]
all-features = true

[advisories]
yanked = "deny"
# Neue "unmaintained"-Hinweise (2026-11) ohne Sicherheitslücke und ohne sichere
# Alternative im Upgrade-Pfad; Ablösung (jiff/time) ist ein eigenes Vorhaben.
ignore = [
    "RUSTSEC-2026-0543", # chrono unmaintained
    "RUSTSEC-2026-0555", # chrono-tz unmaintained
]

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
