[workspace]
resolver = "3"
members = ["crates/atvprep-core", "crates/atvprep", "crates/atvprep-testkit", "crates/atvprep-manager", "crates/atvprep-api", "crates/atvprep-deploy"]

[workspace.package]
version = "0.5.6"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow" # `assert!(x.is_empty())` reads better than comparing with an empty literal
struct_excessive_bools = "allow" # option structs mirror the command-line switches one to one
