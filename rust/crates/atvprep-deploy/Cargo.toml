[package]
name = "atvprep-deploy"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
atvprep-core = { path = "../atvprep-core" }
atvprep-manager = { path = "../atvprep-manager" }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
semver = "1.0.28"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
