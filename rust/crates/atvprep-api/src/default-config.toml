[server]
bind_host = "127.0.0.1"
bind_port = 8765
allowed_origins = ["http://localhost"]

[storage]
state_dir = "/var/lib/atvprep-manager"

[library]
roots = ["/mnt/media/Film", "/mnt/media/TV"]

[auth]
session_absolute_ttl_seconds = 28800
session_idle_ttl_seconds = 3600
csrf_ttl_seconds = 900
session_cookie_secure = true

[automation]
scan_interval_seconds = 3600
settle_seconds = 120
auto_fix_mp4 = false
auto_apply_new_sidecars = false
auto_transcode = false
max_ffmpeg_workers = 1
max_probe_workers = 2

[atvprep]
command = ["atvprep"]
fix_extra_args = []
convert_extra_args = []
