[package]
name = "atvprep"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
atvprep-api = { path = "../atvprep-api" }
atvprep-core = { path = "../atvprep-core" }
atvprep-deploy = { path = "../atvprep-deploy" }
atvprep-manager = { path = "../atvprep-manager" }
axum = { version = "0.8.8", features = ["json", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
signal-hook = "0.4.5"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "signal", "macros"] }

[lints]
workspace = true

[dev-dependencies]
atvprep-testkit = { path = "../atvprep-testkit" }
tempfile = "3"
