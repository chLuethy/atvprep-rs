name: Verify and publish release
on:
  workflow_dispatch:
    inputs:
      resume_verified_draft:
        description: 'Publish an existing draft only after independently verifying all uploaded bytes'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo); fi
          "${SUDO[@]}" apt-get update
          "${SUDO[@]}" apt-get install -y jq binutils openssh-client qemu-user-static
      - name: Verify committed release
        shell: bash
        env:
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
          RESUME_VERIFIED_DRAFT: ${{ inputs.resume_verified_draft }}
        run: |
          set -euo pipefail
          for file in release/release.json release/release.json.sig release/release.pub release/atvprep-linux-x86_64 release/atvprep-linux-aarch64; do
            git ls-files --error-unmatch "$file" >/dev/null
          done
          version=$(jq -er '.version' release/release.json)
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' rust/Cargo.toml)
          test "$version" = "$workspace_version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          elif [ "$RESUME_VERIFIED_DRAFT" = 'true' ]; then
            git fetch origin "refs/tags/v$version:refs/tags/v$version"
            for file in release/release.json release/release.json.sig release/release.pub release/atvprep-linux-x86_64 release/atvprep-linux-aarch64; do
              test "$(git rev-parse "v$version:$file")" = "$(git hash-object "$file")"
            done
          fi
          RELEASE_VERSION="$version" ./scripts/check-release.sh
      - name: Publish verified bytes
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.resume_verified_draft == 'true')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_VERIFIED_DRAFT: ${{ inputs.resume_verified_draft }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/publish-release.sh
