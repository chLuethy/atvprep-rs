name: Rust and frontend CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=()
          else
            SUDO=(sudo)
          fi
          "${SUDO[@]}" apt-get update
          "${SUDO[@]}" apt-get install -y ffmpeg cmake build-essential git
          git clone --depth 1 --branch v1.6.0-641 https://github.com/axiomatic-systems/Bento4.git "$RUNNER_TEMP/bento4"
          test "$(git -C "$RUNNER_TEMP/bento4" rev-parse HEAD)" = dc264854d1f76c370b65b18d9f303a95f7f21ab1
          cmake -S "$RUNNER_TEMP/bento4" -B "$RUNNER_TEMP/bento4-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/bento4-build" --target mp4info mp4dump --parallel 2
          test -x "$RUNNER_TEMP/bento4-build/mp4info"
          test -x "$RUNNER_TEMP/bento4-build/mp4dump"
          ffmpeg -version
          ffprobe -version
          echo "$RUNNER_TEMP/bento4-build" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
