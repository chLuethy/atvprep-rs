name: Probe native release builds
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The v0.8.0 release provides a signed baseline and measured emulated build times.
  SOURCE_COMMIT: 8ff94544a99eab6af25f04e65e8eb2168fad44a7
  RELEASE_VERSION: '0.8.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x86_64
            docker_architecture: amd64
          - runner: ubuntu-26.04-arm
            architecture: aarch64
            docker_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Build the tagged source natively
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DOCKER_ARCHITECTURE: ${{ matrix.docker_architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCHITECTURE"
          builder="atvprep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create --name "$builder" --driver docker-container
          trap 'docker buildx rm "$builder"' EXIT
          docker buildx build --builder "$builder" --platform "linux/$DOCKER_ARCHITECTURE" \
            --file rust/release/Dockerfile --target artifacts \
            --output "type=local,dest=$RUNNER_TEMP/atvprep-build" .
          mv "$RUNNER_TEMP/atvprep-build/atvprep" "$RUNNER_TEMP/atvprep-linux-$ARCHITECTURE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'atvprep-linux-${{ matrix.architecture }}'
          path: '${{ runner.temp }}/atvprep-linux-${{ matrix.architecture }}'
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'atvprep-linux-*'
          merge-multiple: true
          path: release
      - name: Install verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq binutils openssh-client qemu-user
      - name: Verify the signed manifest and install on the native architecture
        shell: bash
        env:
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: |
          set -euo pipefail
          chmod +x release/atvprep-linux-x86_64 release/atvprep-linux-aarch64
          ./scripts/check-release.sh
