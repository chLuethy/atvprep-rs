name: Build, verify and publish release
on:
  workflow_dispatch:
    inputs:
      mirror_version:
        description: 'Only mirror the already published GitHub release of this version to Gitea (e.g. 0.5.9). Empty: build and verify without publishing.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || inputs.mirror_version == ''
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            architecture: x86_64
            docker_architecture: amd64
          - runner: ubuntu-26.04-arm
            architecture: aarch64
            docker_architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the signed manifest inputs and version
        shell: bash
        run: |
          set -euo pipefail
          for file in release/release.json release/release.json.sig release/release.pub; do
            git ls-files --error-unmatch "$file" >/dev/null
          done
          version=$(jq -er '.version' release/release.json)
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' rust/Cargo.toml)
          test "$version" = "$workspace_version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
      - name: Build from source on the native architecture
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DOCKER_ARCHITECTURE: ${{ matrix.docker_architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCHITECTURE"
          builder="atvprep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create --name "$builder" --driver docker-container
          trap 'docker buildx rm "$builder"' EXIT
          export BUILDX_BUILDER="$builder"
          ./rust/release/build.sh "$RUNNER_TEMP/atvprep-release" "$DOCKER_ARCHITECTURE"
          mv "$RUNNER_TEMP/atvprep-release/linux-$ARCHITECTURE/atvprep" "$RUNNER_TEMP/atvprep-linux-$ARCHITECTURE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'atvprep-linux-${{ matrix.architecture }}'
          path: '${{ runner.temp }}/atvprep-linux-${{ matrix.architecture }}'
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  verify:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'atvprep-linux-*'
          merge-multiple: true
          path: release
      - name: Install verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq binutils openssh-client qemu-user
      - name: Verify the signed manifest and install on the native architecture
        shell: bash
        env:
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: |
          set -euo pipefail
          chmod +x release/atvprep-linux-x86_64 release/atvprep-linux-aarch64
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/check-release.sh

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'atvprep-linux-*'
          merge-multiple: true
          path: release
      - name: Verify the downloaded bytes before publishing
        shell: bash
        env:
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq binutils openssh-client qemu-user
          chmod +x release/atvprep-linux-x86_64 release/atvprep-linux-aarch64
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/check-release.sh
      - name: Publish verified bytes on GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/publish-release.sh

  mirror:
    needs: publish
    if: >-
      always() && (
        (github.event_name == 'push' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.mirror_version != '' && needs.publish.result == 'skipped')
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the published GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_VERSION: ${{ inputs.mirror_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; else version=${MIRROR_VERSION#v}; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          # Only a published GitHub release is mirrored; gh would also find an unpublished draft.
          test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = false
          gh release download "v$version" --dir "$RUNNER_TEMP/assets"
      - name: Mirror code and release to Gitea
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}
          GITEA_REPO: ${{ vars.GITEA_REPO }}
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: ./scripts/mirror-release.sh "$RUNNER_TEMP/assets"
