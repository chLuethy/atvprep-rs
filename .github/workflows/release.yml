name: Build, verify and publish release
on:
  workflow_dispatch:
    inputs:
      mirror_version:
        description: 'Only mirror the already published GitHub release of this version to Gitea (e.g. 0.5.9). Empty: build and verify without publishing.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: github.event_name == 'push' || inputs.mirror_version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq binutils openssh-client qemu-user
      - name: Register arm64 emulation for the aarch64 build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Check the signed manifest inputs and version
        shell: bash
        run: |
          set -euo pipefail
          for file in release/release.json release/release.json.sig release/release.pub; do
            git ls-files --error-unmatch "$file" >/dev/null
          done
          version=$(jq -er '.version' release/release.json)
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' rust/Cargo.toml)
          test "$version" = "$workspace_version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
      - name: Build the binaries from the tagged source
        shell: bash
        run: |
          set -euo pipefail
          builder="atvprep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          docker buildx create --name "$builder" --driver docker-container
          trap 'docker buildx rm "$builder"' EXIT
          export BUILDX_BUILDER="$builder"
          docker buildx inspect "$builder" --bootstrap
          ./rust/release/build.sh "$RUNNER_TEMP/atvprep-release"
          cp "$RUNNER_TEMP/atvprep-release/linux-x86_64/atvprep" release/atvprep-linux-x86_64
          cp "$RUNNER_TEMP/atvprep-release/linux-aarch64/atvprep" release/atvprep-linux-aarch64
          chmod +x release/atvprep-linux-x86_64 release/atvprep-linux-aarch64
          sha256sum release/atvprep-linux-x86_64 release/atvprep-linux-aarch64
      - name: Verify the signed manifest against the built bytes
        shell: bash
        env:
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/check-release.sh
      - name: Publish verified bytes on GitHub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(jq -er '.version' release/release.json) ./scripts/publish-release.sh

  mirror:
    needs: release
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.mirror_version != '' && needs.release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the published GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_VERSION: ${{ inputs.mirror_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; else version=${MIRROR_VERSION#v}; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          gh release download "v$version" --dir "$RUNNER_TEMP/assets"
      - name: Mirror code and release to Gitea
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}
          GITEA_REPO: ${{ vars.GITEA_REPO }}
          RELEASE_TRUSTED_KEY: ${{ secrets.RELEASE_TRUSTED_KEY }}
        run: ./scripts/mirror-release.sh "$RUNNER_TEMP/assets"
