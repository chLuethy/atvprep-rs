/* Christian Lüthy — generated from tokens.json */
:root, [data-theme="light"] {
  --surface: #faf9f7; /* Seitenhintergrund am Bildschirm. Im Druck: Papierweiss (#ffffff). */
  --surface-raised: #ffffff; /* Karten, Panels, Dialoge, Briefbogen und Folienflächen. */
  --sand: #f0e8df; /* Warme Tönung aus dem Kupfer abgeleitet: Tabellenköpfe, hervorgehobene Zeilen, Zitate. Text darauf in ink (14.6:1 / 10.8:1). */
  --line: #d8c9ba; /* Bildschirm-Trenner (1px), wo eine volle Kupferlinie zu laut wäre. Dekorativ – nicht für Control-Rahmen. */
  --ink: #1a171b; /* Haupttext – das fast schwarze, leicht warme Schwarz der Rechnungsvorlage (≥14:1 auf allen Flächen). */
  --ink-muted: #68625c; /* Sekundärtext, Metadaten, Rahmen von Eingabefeldern (≥4.9:1 auch auf sand). */
  --brand: #805c3a; /* Kupferbraun – die einzige Farbe des Systems, aus der Rechnungsvorlage übernommen. Haarlinien, Hilfslinien, Feldbezeichnungen (Adresse:, Telefon:), Links, Primärbuttons, Fokus (5.7:1 / 7.6:1 auf surface). */
  --on-brand: #ffffff; /* Text und Icons auf Kupferflächen (6:1 / 7.4:1). */
  --success: #3c6878; /* Erfolg / online / bezahlt. Schieferblau – natürlich und gedämpft, bewusst kein Grün, damit es für Rot-Grün-Schwache klar von danger getrennt ist. Text, Rahmen und Symbole auf surface und surface-raised (≥5.8:1 / ≥7.5:1). Immer mit Wort oder Symbol (✓). */
  --warning: #86661c; /* Warnung / ausstehend / fällig. Erdiges Ocker. Liegt nah am Kupfer, deshalb nie ohne Wort oder Symbol (▲). Auf surface und surface-raised (≥5:1 / ≥8:1). */
  --danger: #a13a2b; /* Fehler / offline / überfällig, Fehlerrahmen von Eingabefeldern. Ziegelrot. Auf surface und surface-raised (≥6.3:1 / ≥6.5:1). Immer mit Wort oder Symbol (✕). */
}
[data-theme="dark"] {
  --surface: #141312;
  --surface-raised: #1e1c1a;
  --sand: #3a3029;
  --line: #4d4238;
  --ink: #efebe6;
  --ink-muted: #a8a097;
  --brand: #c99d74;
  --on-brand: #1a140f;
  --success: #8db3c2;
  --warning: #cfae63;
  --danger: #df8a7a;
}
:root {
  --space-1: 4px; /* Grundeinheit des 4px-Rasters; auch Strich- und Lückenlänge der gestrichelten Hilfslinien. */
  --space-2: 8px; /* Innenabstand kleiner Controls, Abstand Label–Wert. */
  --space-4: 16px; /* Karten-Padding, Abstand zwischen Feldern, Standard-Gutter. */
  --space-8: 32px; /* Abstand zwischen Abschnitten, Seitenränder am Bildschirm. */
  --radius-0: 0; /* Standard: Rahmen, Buttons, Felder, Karten – alles rechtwinklig wie die Vorlage. */
  --radius-sm: 2px; /* Nur wo 0 am Bildschirm hart flimmert (kleine Badges, Tooltips). */
  --radius-full: 9999px; /* Kreise und Pillen mit Bedeutung: Statuspunkt, Avatar, Schalter. */
  --hairline: 1px; /* Alle Linien am Bildschirm, in brand oder line. Im Druck 0.25pt in brand. */

  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --text-h1: 400 28px/34px var(--font-sans); /* Seiten- und Dokumenttitel. */
  --text-h2: 400 20px/26px var(--font-sans); /* Abschnittstitel; im Druck 12pt wie der Titelbalken der Rechnung. */
  --text-h3: 500 15px/20px var(--font-sans); /* Kartentitel und Panel-Überschriften in Apps. Einziger Ort mit Medium-Gewicht. */
  --text-body: 400 15px/21px var(--font-sans); /* Fliesstext am Bildschirm. Im Druck 9pt auf 10.8pt Zeilenabstand (120 %) wie in der Vorlage. */
  --text-small: 400 12px/16px var(--font-sans); /* Legenden, Metadaten, dichte Tabellen. Farbe ink-muted. */
  --text-label: 400 11px/14px var(--font-sans); /* Feldbezeichnung links vom Wert, immer in brand und mit Doppelpunkt. Im Druck 7pt. */
  --text-code: 400 13px/18px var(--font-mono); /* Code, Befehle, Pfade, Hostnamen, Messwerte in Dashboards. JetBrains Mono, Ligaturen aus (font-variant-ligatures: none) ausser im Editor. */

:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface: #141312;
  --surface-raised: #1e1c1a;
  --sand: #3a3029;
  --line: #4d4238;
  --ink: #efebe6;
  --ink-muted: #a8a097;
  --brand: #c99d74;
  --on-brand: #1a140f;
  --success: #8db3c2;
  --warning: #cfae63;
  --danger: #df8a7a;
color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}

/* Christian Lüthy — Komponenten. Alle Werte aus tokens.css; Präfix chl- */
.chl{font-family:var(--font-sans);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.chl *,.chl *::before,.chl *::after{box-sizing:border-box}
.chl-label{font:var(--text-label);color:var(--brand)}

/* Button */
.chl-btn{display:inline-flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-4);border:var(--hairline) solid transparent;border-radius:var(--radius-0);font:400 14px/20px var(--font-sans);cursor:pointer;text-decoration:none;white-space:nowrap;background:none;color:var(--ink)}
.chl-btn--sm{height:24px;padding:0 var(--space-2);font-size:12px;line-height:16px}
.chl-btn--primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chl-btn--primary:hover{background:var(--ink);border-color:var(--ink);color:var(--surface-raised)}
.chl-btn--secondary{background:var(--surface-raised);border-color:var(--ink-muted);color:var(--ink)}
.chl-btn--secondary:hover{border-color:var(--brand);color:var(--brand)}
.chl-btn--quiet{color:var(--brand);padding-left:0;padding-right:0}
.chl-btn--quiet:hover{text-decoration:underline;text-underline-offset:3px}
.chl-btn:focus-visible,.chl-input:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:2px}
.chl-btn:disabled,.chl-btn[aria-disabled="true"]{cursor:not-allowed;background:var(--surface-raised);border-color:var(--line);color:var(--ink-muted)}
.chl-btn--quiet:disabled{background:none;border-color:transparent}

/* TextField */
.chl-field{display:grid;gap:var(--space-1);min-width:0}
.chl-input{height:32px;width:100%;padding:0 var(--space-2);border:var(--hairline) solid var(--ink-muted);border-radius:var(--radius-0);background:var(--surface-raised);color:var(--ink);font:var(--text-body)}
.chl-input::placeholder{color:var(--ink-muted)}
.chl-input--mono{font:var(--text-code);font-size:14px}
.chl-input:disabled{border-color:var(--line);color:var(--ink-muted)}
.chl-hint{font:var(--text-small);color:var(--ink-muted)}

/* Badge */
.chl-badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 var(--space-2);border:var(--hairline) solid var(--brand);border-radius:var(--radius-sm);font:var(--text-label);color:var(--brand);white-space:nowrap}
.chl-badge--solid{background:var(--brand);color:var(--on-brand)}
.chl-badge--neutral{border-color:transparent;background:var(--sand);color:var(--ink)}
.chl-dot{width:6px;height:6px;border-radius:var(--radius-full);background:currentColor;flex:none}
.chl-dot--off{background:none;box-shadow:inset 0 0 0 1px currentColor}

/* Card */
.chl-card{background:var(--surface-raised);border:var(--hairline) solid var(--line);border-radius:var(--radius-0);padding:var(--space-4)}
.chl-card__head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);margin-bottom:var(--space-2)}
.chl-card__title{margin:0;font:var(--text-h3);color:var(--ink)}
.chl-card__body{font:var(--text-body);color:var(--ink)}
.chl-card__body p{margin:0}

/* Stat */
.chl-stat{display:grid;gap:var(--space-1);padding-left:var(--space-2);background:linear-gradient(var(--brand) 50%,transparent 0) left top/1px 8px repeat-y}
.chl-stat__value{font:400 28px/32px var(--font-mono);letter-spacing:-0.02em;color:var(--ink)}
.chl-stat__unit{font:var(--text-code);color:var(--ink-muted);margin-left:var(--space-1)}
.chl-stat__note{font:var(--text-small);color:var(--ink-muted)}

/* Sender (Absender) */
.chl-sender{display:grid;grid-template-columns:max-content 1fr;column-gap:var(--space-4);row-gap:0;margin:0}
.chl-sender dt{font:var(--text-label);color:var(--brand);padding-top:3px}
.chl-sender dd{margin:0;font:var(--text-body);color:var(--ink);text-transform:lowercase}
.chl-sender dt.chl-sender__blank{visibility:hidden}

/* AddressField */
.chl-address{position:relative;padding:var(--space-8);font:var(--text-body);color:var(--ink);min-height:144px;display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-8)}
.chl-address__c{position:absolute;width:12px;height:12px;border:0 solid var(--brand)}
.chl-address__c--tl{top:0;left:0;border-top-width:var(--hairline);border-left-width:var(--hairline)}
.chl-address__c--tr{top:0;right:0;border-top-width:var(--hairline);border-right-width:var(--hairline)}
.chl-address__c--bl{bottom:0;left:0;border-bottom-width:var(--hairline);border-left-width:var(--hairline)}
.chl-address__c--br{bottom:0;right:0;border-bottom-width:var(--hairline);border-right-width:var(--hairline)}
.chl-address p{margin:0}

/* TitleBar */
.chl-titlebar{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding:var(--space-1) var(--space-2);border:var(--hairline) solid var(--brand);border-radius:var(--radius-0);font:var(--text-h2);color:var(--ink)}
.chl-titlebar--bleed{margin-left:calc(-1 * var(--space-8));padding-left:calc(var(--space-2) + 0px)}
.chl-titlebar__no{font-variant-numeric:tabular-nums}

/* LineItems */
.chl-items{width:100%;border-collapse:collapse;font:var(--text-body);color:var(--ink)}
.chl-items th{font:var(--text-small);color:var(--ink);text-align:left;font-weight:400;padding:var(--space-2) var(--space-2) var(--space-4)}
.chl-items td{padding:0 var(--space-2);vertical-align:top}
.chl-items .chl-num{text-align:right;white-space:nowrap}
.chl-items .chl-guide{background:linear-gradient(var(--brand) 50%,transparent 0) left top/1px 8px repeat-y}
.chl-items .chl-sub{color:var(--ink-muted)}
.chl-items tfoot td{padding-top:var(--space-4)}
.chl-items tfoot tr:first-child td{border-top:var(--hairline) solid var(--brand)}
.chl-items .chl-total td{font:var(--text-h3);font-weight:400}

/* Status */
.chl-input[aria-invalid="true"]{border-color:var(--danger)}
.chl-input[aria-invalid="true"]:focus-visible{outline-color:var(--danger)}
.chl-error{font:var(--text-small);color:var(--danger)}
.chl-badge--success{border-color:var(--success);color:var(--success)}
.chl-badge--warning{border-color:var(--warning);color:var(--warning)}
.chl-badge--danger{border-color:var(--danger);color:var(--danger)}
.chl-sym{font-size:9px;line-height:1;flex:none}

/* Notice */
.chl-notice{display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-2);padding:var(--space-2) var(--space-4);border:var(--hairline) solid var(--brand);background:transparent;color:var(--ink);border-radius:var(--radius-0);font:var(--text-body)}
.chl-notice__sym{color:var(--brand);font:400 13px/21px var(--font-sans);width:14px;text-align:center}
.chl-notice__title{font-weight:500}
.chl-notice__text{grid-column:2}
.chl-notice--success{border-color:var(--success)}
.chl-notice--success .chl-notice__title{color:var(--success)}
.chl-notice--success .chl-notice__sym{color:var(--success)}
.chl-notice--warning{border-color:var(--warning)}
.chl-notice--warning .chl-notice__title{color:var(--warning)}
.chl-notice--warning .chl-notice__sym{color:var(--warning)}
.chl-notice--danger{border-color:var(--danger)}
.chl-notice--danger .chl-notice__title{color:var(--danger)}
.chl-notice--danger .chl-notice__sym{color:var(--danger)}

/* Icon */
.chl-icon{display:inline-block;vertical-align:middle;flex:none}

/* atvprep Manager: Anwendungs-Layout auf Basis der chl-Tokens. Alle Farben, Abstände, Linien aus tokens.css. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:var(--text-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
*,*::before,*::after{box-sizing:border-box}
a{color:var(--brand);text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:13px;line-height:18px;font-variant-ligatures:none}
.muted{color:var(--ink-muted)}
.small{font:var(--text-small)}
.label{font:var(--text-label);color:var(--brand)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.guide-r{background:linear-gradient(var(--brand) 50%,transparent 0) right top/1px 8px repeat-y}
.guide-l{background:linear-gradient(var(--brand) 50%,transparent 0) left top/1px 8px repeat-y}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{position:relative;display:flex;flex-direction:column;gap:var(--space-8);padding:var(--space-4) var(--space-4) var(--space-4) max(var(--space-4),env(safe-area-inset-left,0px));overflow:auto}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(var(--brand) 50%,transparent 0) right top/1px 8px repeat-y}
.brand{display:grid;gap:var(--space-2);padding-top:var(--space-2)}
.brand__name{font:var(--text-h2);letter-spacing:-0.01em;color:var(--ink)}
.brand dl{margin:0;display:grid;grid-template-columns:max-content 1fr;column-gap:var(--space-2)}
.brand dt{font:var(--text-label);color:var(--brand);padding-top:2px}
.brand dd{margin:0;font:var(--text-small);color:var(--ink)}
.nav{display:grid;gap:var(--space-1)}
.nav a{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-2);color:var(--ink);text-decoration:none;border:var(--hairline) solid transparent;font:400 14px/20px var(--font-sans)}
.nav a:hover{border-color:var(--line)}
.nav a[aria-current="page"]{border-color:var(--brand);color:var(--brand)}
.nav a .chl-badge{margin-left:auto}
.side__foot{margin-top:auto;display:grid;gap:var(--space-2)}
.seg{display:inline-grid;grid-auto-flow:column;border:var(--hairline) solid var(--ink-muted)}
.seg button{height:24px;padding:0 var(--space-2);border:0;background:var(--surface-raised);cursor:pointer;font:var(--text-small)}
.seg button+button{border-left:var(--hairline) solid var(--ink-muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.menu-toggle{display:none}
.main{overflow:auto;padding:var(--space-8) max(var(--space-8),env(safe-area-inset-right,0px)) var(--space-8) var(--space-8)}
.page{display:grid;gap:var(--space-4);max-width:1360px;margin:0 auto;min-width:0}
.lede{margin:0;color:var(--ink-muted);max-width:68ch}
.kbd{display:inline-block;min-width:20px;padding:0 5px;border:var(--hairline) solid var(--ink-muted);font:400 11px/16px var(--font-mono);text-align:center;color:var(--ink);background:var(--surface-raised)}

/* Werkzeugleiste, Chips */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar{align-items:stretch}
.toolbar>*{align-self:center}
.toolbar .seg{align-self:stretch}
.toolbar .seg button{height:100%;min-height:32px;padding:0 var(--space-4);font:400 14px/20px var(--font-sans)}
.toolbar .chl-btn,.toolbar select.chl-input{height:32px}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.chips__label{font:var(--text-label);color:var(--brand);margin-right:var(--space-1)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--space-2);border:var(--hairline) solid var(--ink-muted);background:var(--surface-raised);color:var(--ink);font:var(--text-small);cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--sand);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"\2713";color:var(--brand);font-size:10px}
.chip .mono{font-size:11px;color:var(--ink-muted)}
.search{position:relative;display:flex;align-items:center}
.search .chl-icon{position:absolute;left:var(--space-2);color:var(--ink-muted);pointer-events:none}
.search .chl-input{padding-left:32px}
select.chl-input{appearance:none;-webkit-appearance:none;width:auto;min-width:170px;padding-right:32px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* Tabellen mit Spaltenhilfslinien */
.tablewrap{overflow:auto;border:var(--hairline) solid var(--line);background:var(--surface-raised);min-width:0}
table.tbl{width:100%;border-collapse:collapse;font:var(--text-body)}
.tbl th{position:sticky;top:0;z-index:1;background:var(--sand);color:var(--ink);font:var(--text-small);text-align:left;padding:var(--space-2);white-space:nowrap;border-bottom:var(--hairline) solid var(--brand)}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th button:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:2px}
.tbl td{padding:var(--space-2);vertical-align:middle}
.tbl td.g,.tbl th.g{background-image:linear-gradient(var(--brand) 50%,transparent 0);background-size:1px 8px;background-repeat:repeat-y;background-position:left top}
.tbl th.g{background-color:var(--sand)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background-color:color-mix(in srgb,var(--sand) 45%,transparent)}
.tbl tbody tr[aria-selected="true"] td{background-color:var(--sand)}
.tbl tbody tr.is-active td:first-child{box-shadow:inset 2px 0 0 var(--brand)}
.tbl .r{text-align:right}
.cell-name{display:grid;gap:2px;min-width:0}
.cell-name b{font-weight:400;overflow-wrap:anywhere}
.cell-name span{font:var(--text-small);color:var(--ink-muted);overflow-wrap:anywhere}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:14px;height:14px;margin:0}

/* Zwei-Spalten-Arbeitsflächen */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-4);align-items:start}
.split.has-detail{grid-template-columns:minmax(0,1fr) minmax(340px,420px)}
.split.files .tablewrap{max-height:none!important}
.split.files.has-detail{align-items:stretch}
.split.files .cols{max-height:none;height:100%}
.panel{position:relative;background:var(--surface-raised);border:var(--hairline) solid var(--line);min-width:0}
.panel__head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding:var(--space-4) var(--space-4) var(--space-2)}
.panel__title{margin:0;font:var(--text-h3)}
.panel__body{padding:var(--space-2) var(--space-4) var(--space-4);display:grid;gap:var(--space-4)}
.sticky-detail{position:sticky;top:0;max-height:calc(100vh - 2 * var(--space-8));overflow:auto}
.dl{margin:0;display:grid;grid-template-columns:max-content 1fr;column-gap:var(--space-4);row-gap:var(--space-1);align-items:baseline}
.dl dt{font:var(--text-label);color:var(--brand)}
.dl dd{margin:0;font:var(--text-body);min-width:0;overflow-wrap:anywhere}
.sec{display:grid;gap:var(--space-2)}
.sec>h4{margin:0;font:var(--text-label);color:var(--brand)}
.reasons{margin:0;padding:0;list-style:none;display:grid;gap:var(--space-1)}
.reasons li{display:grid;grid-template-columns:14px 1fr;column-gap:var(--space-2);font:var(--text-body)}
.sym{font:400 12px/21px var(--font-sans);text-align:center}
.t-success{color:var(--success)}.t-warning{color:var(--warning)}.t-danger{color:var(--danger)}.t-brand{color:var(--brand)}
.streams{width:100%;border-collapse:collapse;font:var(--text-small)}
.streams td{padding:var(--space-1) var(--space-2) var(--space-1) 0;vertical-align:top}
.streams td:first-child{color:var(--brand);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.selbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:center;padding:var(--space-2) var(--space-4);background:var(--surface-raised);border:var(--hairline) solid var(--brand)}
.selbar .grow{flex:1 1 auto}
.empty{display:grid;gap:var(--space-2);padding:var(--space-8);justify-items:start}
.empty h3{margin:0;font:var(--text-h2)}
.empty p{margin:0;color:var(--ink-muted);max-width:60ch}
.confirm{display:inline-flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}

/* Fortschritt */
.bar{height:4px;background:var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--brand);width:0;transition:width .5s linear}
.bar--thin{height:2px}

/* Spaltenansicht */
.cols{display:flex;overflow:auto;border:var(--hairline) solid var(--line);background:var(--surface-raised);min-height:340px;max-height:60vh}
.col{flex:0 0 260px;min-width:0;overflow:auto;position:relative}
.col+.col{background:linear-gradient(var(--brand) 50%,transparent 0) left top/1px 8px repeat-y}
.col+.col h4,.col+.col button{margin-left:1px;width:calc(100% - 1px)}
.col h4{margin:0;padding:var(--space-2) var(--space-4);font:var(--text-label);color:var(--brand);position:sticky;top:0;background:var(--surface-raised)}
.col button{all:unset;box-sizing:border-box;display:flex;gap:var(--space-2);align-items:center;width:100%;padding:6px var(--space-4);cursor:pointer;font:var(--text-body)}
.col button:hover{background:color-mix(in srgb,var(--sand) 45%,transparent)}
.col button[aria-selected="true"]{background:var(--sand)}
.col button:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:-2px}
.col button span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Aufträge */
.joblist{display:grid}
.job{all:unset;box-sizing:border-box;display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-4);border-bottom:var(--hairline) solid var(--line);cursor:pointer}
.job:hover{background:color-mix(in srgb,var(--sand) 45%,transparent)}
.job[aria-current="true"]{background:var(--sand);box-shadow:inset 2px 0 0 var(--brand)}
.job:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:-2px}
.job__top{display:flex;justify-content:space-between;gap:var(--space-2);align-items:baseline}
.job__title{font:var(--text-body);overflow-wrap:anywhere}
.job__meta{font:var(--text-small);color:var(--ink-muted)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:center;padding:var(--space-2) 0;border-bottom:var(--hairline) solid var(--line)}
.item .bar{grid-column:1/-1}
.log{margin:0;padding:var(--space-2) var(--space-4);background:var(--surface);border:var(--hairline) solid var(--line);font:var(--text-code);font-size:12px;line-height:17px;max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.log .step{color:var(--brand)}
.log .err{color:var(--danger)}
.log .dim{color:var(--ink-muted)}

/* Zeitpläne */
.sched{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr) 120px;align-items:stretch}
.sched>div{padding:var(--space-4);min-width:0;display:grid;gap:var(--space-1);align-content:start}
.sched>div+div{background:linear-gradient(var(--brand) 50%,transparent 0) left top/1px 8px repeat-y}
.sched__hist{padding:0;display:grid;gap:0}
.sched__hist>.actions{padding:var(--space-2) var(--space-4);border-top:var(--hairline) solid var(--line)}
.sched__hist>:not(.actions){padding:var(--space-4) var(--space-4) 0}
.sched__hist>:last-child:not(.actions){padding-bottom:var(--space-4)}
.hist{display:grid;grid-template-columns:150px 110px minmax(0,1fr);gap:var(--space-2);font:var(--text-small);padding:var(--space-1) 0;border-top:var(--hairline) solid var(--line)}
.stack{display:grid;gap:var(--space-4)}
.sched-card{background:var(--surface-raised);border:var(--hairline) solid var(--line)}
.sched-card+.sched-card{margin-top:0}

/* Übersicht */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--space-4);padding:var(--space-4);background:var(--surface-raised);border:var(--hairline) solid var(--line)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:var(--space-4);align-items:start}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:var(--space-2) 0;border-top:var(--hairline) solid var(--line)}
.row:first-child{border-top:0}
.health{display:grid;gap:var(--space-2)}
.health__row{display:grid;grid-template-columns:172px minmax(0,1fr) 44px;gap:var(--space-2);align-items:center;font:var(--text-body)}
.feed{display:grid}
.feed__row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-top:var(--hairline) solid var(--line);font:var(--text-body)}
.feed__row:first-child{border-top:0}
.feed__row time{font:var(--text-code);font-size:12px;color:var(--ink-muted)}

/* Einstellungen */
.form{display:grid;gap:var(--space-4)}
.formcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);align-items:start}
@media (max-width:1100px){.formcols{grid-template-columns:minmax(0,1fr)}}
.fieldset{display:grid;gap:var(--space-4);padding:var(--space-4);background:var(--surface-raised);border:var(--hairline) solid var(--line);margin:0}
.fieldset legend{padding:0 var(--space-2);font:var(--text-label);color:var(--brand)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--space-4)}
.check{display:grid;grid-template-columns:auto 1fr;gap:var(--space-2);align-items:start}
.check label{font:var(--text-body)}
.check .chl-hint{grid-column:2}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:center;padding:var(--space-2) var(--space-4);background:var(--surface-raised);border:var(--hairline) solid var(--brand)}
textarea.chl-input{height:auto;padding:var(--space-2);resize:vertical;min-height:84px;font:var(--text-code)}

/* Dialoge, Toasts, Palette */
dialog{padding:0;border:var(--hairline) solid var(--brand);background:var(--surface-raised);color:var(--ink);max-width:min(640px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(20,19,18,.55)}
.dlg{display:grid;gap:var(--space-4);padding:var(--space-4) var(--space-4) var(--space-4)}
.dlg h2{margin:0;font:var(--text-h2)}
.dlg__foot{display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:flex-end}
.opts{display:grid;gap:var(--space-2)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:var(--space-2);padding:var(--space-2);border:var(--hairline) solid var(--line);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--sand)}
.opt b{font-weight:400}
.pal input{border-color:var(--brand)}
.pal ul{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.pal li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:var(--space-4);width:100%;padding:6px var(--space-2);cursor:pointer}
.pal li button[aria-selected="true"]{background:var(--sand)}
.pal li .hint{color:var(--ink-muted);font:var(--text-small)}
#toasts{position:fixed;right:max(var(--space-4),env(safe-area-inset-right,0px));bottom:max(var(--space-4),env(safe-area-inset-bottom,0px));display:grid;gap:var(--space-2);z-index:50;width:min(420px,calc(100vw - 32px))}
#toasts .chl-notice{background:var(--surface-raised);box-shadow:0 0 0 1px var(--surface-raised)}
.lock{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--surface);padding:var(--space-4)}
.lock__box{display:grid;gap:var(--space-4);width:min(380px,100%);padding:var(--space-8);background:var(--surface-raised);border:var(--hairline) solid var(--brand)}
.lock__box h1{margin:0;font:var(--text-h1);letter-spacing:-0.01em}
.cron-ex button{all:unset;cursor:pointer;color:var(--brand);font:var(--text-small);text-underline-offset:3px}
.cron-ex button:hover{text-decoration:underline}
.cron-ex button:focus-visible{outline:var(--hairline) solid var(--brand);outline-offset:2px}

@media (max-width:1180px){
  .split.has-detail{grid-template-columns:minmax(0,1fr)}
  .sticky-detail{position:static;max-height:none}
  .sched{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sched>div+div{background:none}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:column;gap:var(--space-2);padding:var(--space-2) max(16px,env(safe-area-inset-right,0px)) var(--space-2) max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .side::after{inset:auto 0 0 0;width:auto;height:1px;background:linear-gradient(90deg,var(--brand) 50%,transparent 0) left bottom/8px 1px repeat-x}
  .brand{display:flex;align-items:baseline;justify-content:space-between;padding-top:0}
  .brand dl{display:none}
  .menu-toggle{display:inline-flex}
  .nav,.side__foot{display:none}
  .side.open .nav{display:grid}
  .side.open .side__foot{display:grid;margin-top:0}
  .main{padding:var(--space-4) max(16px,env(safe-area-inset-right,0px)) var(--space-4) max(16px,env(safe-area-inset-left,0px))}
  .sched{grid-template-columns:minmax(0,1fr)}
  .hist{grid-template-columns:minmax(0,1fr)}
  .health__row{grid-template-columns:160px minmax(0,1fr) 36px}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
.footrow{display:flex;justify-content:space-between;align-items:center}
.footrow .chl-btn--quiet{padding:0}
.side__foot{padding-bottom:var(--space-8)}
/* Dateien: Liste und Inspector scrollen je für sich, die Auswahlleiste steht fest unter der Liste */
.split.files{height:calc(100vh - 340px);min-height:420px;align-items:stretch;grid-template-rows:minmax(0,1fr)}
.split.files>div:first-child{grid-template-rows:minmax(0,1fr);min-height:0}
.split.files>div:first-child:has(.selbar){grid-template-rows:minmax(0,1fr) auto}
.split.files .tablewrap{max-height:none!important;height:auto;min-height:0!important}

/* --- Cron --- */
const DOW = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function parseCron(expr) {
  const p = expr.trim().split(/\s+/);
  if (!expr.trim()) return { error: "Einen Cron-Ausdruck eingeben." };
  if (p.length !== 5) return { error: "Ein Cron-Ausdruck hat fünf Felder: Minute, Stunde, Tag des Monats, Monat, Wochentag." };
  const rng = [[0, 59], [0, 23], [1, 31], [1, 12], [0, 7]];
  const names = ["Minute", "Stunde", "Tag des Monats", "Monat", "Wochentag"];
  const sets = [];
  for (let i = 0; i < 5; i++) {
    const set = new Set();
    for (const part of p[i].split(",")) {
      const m = part.match(/^(\*|\d+(?:-\d+)?)(?:\/(\d+))?$/);
      if (!m) return { error: `Das Feld „${names[i]}“ ist ungültig: „${part}“.` };
      let lo, hi;
      if (m[1] === "*") { lo = rng[i][0]; hi = rng[i][1]; }
      else if (m[1].includes("-")) { [lo, hi] = m[1].split("-").map(Number); }
      else { lo = Number(m[1]); hi = m[2] ? rng[i][1] : lo; }
      if (lo < rng[i][0] || hi > rng[i][1] || lo > hi) return { error: `${names[i]}: erlaubt sind ${rng[i][0]} bis ${rng[i][1]}.` };
      const step = m[2] ? Number(m[2]) : 1;
      if (step < 1) return { error: `${names[i]}: Die Schrittweite muss mindestens 1 sein.` };
      for (let v = lo; v <= hi; v += step) set.add(i === 4 && v === 7 ? 0 : v);
    }
    sets.push(set);
  }
  return { sets, domStar: p[2] === "*", dowStar: p[4] === "*", p };
}
function nextRuns(expr, n = 3, from = Date.now()) {
  const c = parseCron(expr);
  if (c.error) return [];
  const out = [];
  const d = new Date(from); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + 1);
  for (let i = 0; i < 60 * 24 * 400 && out.length < n; i++, d.setMinutes(d.getMinutes() + 1)) {
    if (!c.sets[0].has(d.getMinutes()) || !c.sets[1].has(d.getHours()) || !c.sets[3].has(d.getMonth() + 1)) continue;
    const dom = c.sets[2].has(d.getDate()), dow = c.sets[4].has(d.getDay());
    const ok = !c.domStar && !c.dowStar ? dom || dow : dom && dow;
    if (ok) out.push(d.getTime());
  }
  return out;
}
function minGap(expr) {
  const r = nextRuns(expr, 12);
  let g = Infinity;
  for (let i = 1; i < r.length; i++) g = Math.min(g, r[i] - r[i - 1]);
  return g;
}
function describeCron(expr) {
  const c = parseCron(expr);
  if (c.error) return "Cron " + expr;
  const [m, h, dom, mon, dow] = c.p;
  let x;
  if ((x = expr.match(/^\*\/(\d+) \* \* \* \*$/))) return `Alle ${x[1]} Minuten`;
  if ((x = expr.match(/^0 \*\/(\d+) \* \* \*$/))) return `Alle ${x[1]} Stunden, zur vollen Stunde`;
  if (/^\d+$/.test(m) && /^\d+$/.test(h) && dom === "*" && mon === "*") {
    const days = [...c.sets[4]].sort((a, b) => ((a || 7) - (b || 7)));
    const time = `${pad(h)}:${pad(m)}`;
    if (dow === "*") return `Jeden Tag um ${time}`;
    if (days.join() === "1,2,3,4,5") return `Werktags um ${time}`;
    if (days.join() === "6,0" || days.join() === "0,6") return `Am Wochenende um ${time}`;
    return `${days.map((d) => DOW[d]).join(", ")} um ${time}`;
  }
  return "Cron " + expr;
}
function nextRunLabel(s) {
  if (!s.on && s.action === "prepare") return "Kein Lauf geplant";
  if (!s.on) return "Pausiert";
  const n = nextRuns(s.cron, 1)[0];
  if (!n) return "Kein Lauf geplant";
  const sameDay = new Date(n).toDateString() === new Date().toDateString();
  const tomorrow = new Date(n).toDateString() === new Date(Date.now() + DAY).toDateString();
  return `${sameDay ? "Heute" : tomorrow ? "Morgen" : fmtDate(n)} ${fmtClock(n)}`;
}

function filteredFiles(skip) {
  const v = S.fv, q = v.q.trim().toLowerCase();
  return FILES.filter((f) => {
    if (q && !(f.name + " " + f.folder).toLowerCase().includes(q)) return false;
    if (v.lib !== "all" && f.lib !== v.lib) return false;
    if (skip !== "state" && v.states.size && !v.states.has(f.state)) return false;
    if (skip !== "props") for (const [k, , fn] of PROPS) if (v.props.has(k) && !fn(f)) return false;
    return true;
  });
}

/* --- Aktionen der Dateien --- */
function enqueue(action, files, extra = {}) {
  const j = Object.assign({ id: "j" + ++jobSeq, action, trigger: "manual", sched: "", retryOf: "", requested: Date.now(), started: null, finished: null, allowance: "copy", status: "queued", note: "" }, extra, {

  S.jobs.unshift(j);
  pushEvent("job", `${ACTIONS[action]}-Auftrag eingereiht (${plural(files.length, "Datei", "Dateien")})`, "info");
  return j;
}
function verifySelection() {
  const sel = selectedFiles(), ok = sel.filter((f) => f.cont === "mp4" && f.state !== "missing");
  if (!sel.length) return;
  if (!ok.length) return toast("warning", "Die Prüfung gilt nur für MP4-Dateien, und nichts davon ist ausgewählt.");
  enqueue("verify", ok);
  const skipped = sel.length - ok.length;
  toast("success", `Prüfung für ${plural(ok.length, "Datei", "Dateien")} eingereiht.${skipped ? ` ${skipped} übersprungen, weil sie keine MP4 sind.` : ""} Die Ergebnisse erscheinen hier, sobald sie fertig ist.`);

}

}
function prepDialog() {

}
function prepBody(prep) {

  const rewrite = ok.reduce((a, f) => a + f.mb, 0), mins = ok.reduce((a, f) => a + minutesFor(f), 0);

    <div class="sec"><h4>Erwartete Änderung:</h4>

      <dt>Umzuschreiben:</dt><dd>${fmtSize(rewrite)} · etwa ${mins} min</dd>

    ${left.length ? noticeHtml("warning", `${plural(left.length, "Datei braucht", "Dateien brauchen")} eine höhere Freigabe und bleibt${left.length === 1 ? "" : "en"} aussen vor: ${left.slice(0, 2).map((f) => esc(f.base)).join(", ")}${left.length > 2 ? ` und ${left.length - 2} weitere` : ""}.`, "Kodierung nicht freigegeben") : ""}

/* Seite Aktivität: Aufträge, Einträge, Protokoll; dazu die Simulation laufender Aufträge */
const JOB_FILTERS = [["all", "Alle"], ["active", "Aktiv"], ["failed", "Fehlgeschlagen in 24 h"], ["schedule", "Zeitpläne heute"]];
function jobMatches(j) {
  const f = S.jv.filter, q = S.jv.q.trim().toLowerCase();
  if (f === "active" && !isActiveJob(j)) return false;
  if (f === "failed" && !(["failed", "partial_success"].includes(j.status) && Date.now() - (j.finished || j.requested) < DAY)) return false;
  if (f === "schedule" && !(j.trigger === "schedule" && new Date(j.requested).toDateString() === new Date().toDateString())) return false;
  if (q && !(jobTitle(j) + " " + j.items.map((i) => i.name).join(" ") + " " + j.sched).toLowerCase().includes(q)) return false;
  return true;
}
function jobProgress(j) {
  if (!j.items.length) return 0;
  return j.items.reduce((a, i) => a + (["succeeded", "failed", "cancelled", "stale_input", "interrupted"].includes(i.status) ? 100 : i.p), 0) / j.items.length;
}
function jobRow(j) {
  const run = j.status === "running";
  const done = j.items.filter((i) => i.status === "succeeded").length;
  const failed = j.items.filter((i) => i.status === "failed" || i.status === "stale_input").length;
  const meta = isTerminalJob(j.status)

  return `<button type="button" class="job" aria-current="${S.jv.active === j.id}"${A("job", j.id)}>
    <span class="job__top"><span class="job__title">${esc(jobTitle(j))}</span>${jobBadge(j.status)}</span>
    <span class="job__meta">${esc(meta)}</span>
    ${isActiveJob(j) ? `<span data-jp="${j.id}">${bar(jobProgress(j), "Fortschritt von " + jobTitle(j))}</span>` : `<span class="job__meta">${done} von ${j.items.length} erfolgreich${failed ? ` · ${failed} fehlgeschlagen` : ""}</span>`}</button>`;
}
const DETAIL_TEXT = {
  encode_not_allowed: "Kodierung nicht freigegeben: Die Datei bleibt unverändert. Bereite sie mit einer höheren Kodierfreigabe erneut vor.",
  stale_input: "Die freigegebene Datei hat sich geändert, seit der Auftrag eingereiht wurde. Reihe das Vorbereiten erneut ein.",
  missing: "Die Datei fehlt an ihrem Ort.",
};
function logOf(j, it) {
  const f = fileById(it.fid), L = [];
  const step = (t) => L.push(["step", t]);
  const tmp = f ? f.path.replace(/\.[^.]+$/, ".atvprep-tmp.mp4") : "";
  if (j.action === "scan") return [["dim", "Scan"]];
  if (it.status === "queued") return [["dim", "Wartet auf einen freien Platz. Noch nichts ausgeführt."]];
  if (j.action === "prepare") {
    step("ATVPREP-STEP 1/4 Planen");
    L.push(["", `Datei: ${f ? f.path : it.name}`], ["", `Zielprofil: ${profileText()}`], ["", `Kodierfreigabe: ${ALLOWANCE[j.allowance].label}`]);
    if (it.detail === "encode_not_allowed") { L.push(["err", `Plan: ${f ? CHANGES[f.trueChange] : "Re-Encode"} · braucht mehr als „${ALLOWANCE[j.allowance].label}“`], ["err", "Kodierung nicht freigegeben. Die Datei bleibt unverändert."]); return L; }
    if (it.detail === "stale_input") { L.push(["err", "Eingabe verändert: Grösse und Änderungszeit weichen von der Freigabe ab. Abgelehnt, nichts geschrieben."]); return L; }
    L.push(["", `Plan: ${f ? CHANGES[f.trueChange] || "Remux" : "Remux"}`]);
    if (f && f.steps.length && it.status !== "succeeded") f.steps.forEach((s) => L.push(["", "  Schritt: " + s]));
    step("ATVPREP-STEP 2/4 Kodieren");
    L.push(["dim", `ffmpeg -hide_banner -i "${f ? f.path : it.name}" -map 0:v -c:v copy -map 0:a -c:a eac3 -b:a 640k -movflags +faststart "${tmp}"`]);
    const t = Math.max(1, Math.round((it.status === "succeeded" ? 100 : it.p) / 100 * (f ? f.mb / 90 : 40)));
    L.push(["dim", `frame=${nf(t * 1440)} fps=${60 + (t % 9)} size=${nf(t * 14)}MiB time=00:${pad(Math.min(59, t))}:${pad((t * 7) % 60)} speed=${(1.8 + (t % 5) / 10).toFixed(1)}x`]);
    if (it.status === "running") return L;
    if (it.status === "failed") { L.push(["err", `ffmpeg beendet mit Code 1`]); return L; }
    step("ATVPREP-STEP 3/4 Prüfen");
    L.push(["", "Prüfung der neuen MP4: keine Verstösse."]);
    step("ATVPREP-STEP 4/4 Ersetzen");
    L.push(["", S.settings.deleteOriginal ? "Original entfernt, MP4 an den Platz der Quelle gesetzt." : "Original bleibt erhalten, MP4 daneben abgelegt."], ["", it.status === "cancelled" ? "Abgebrochen." : "Fertig."]);
    return L;
  }
  step(`ATVPREP-STEP 1/2 ${j.action === "verify" ? "Prüfen" : "Analysieren"}`);
  L.push(["", `Datei: ${f ? f.path : it.name}`], ["dim", `ffprobe -v error -show_streams -show_format -of json "${f ? f.path : it.name}"`]);
  if (it.status === "running") { L.push(["dim", "Streams werden gelesen…"]); return L; }
  if (it.status === "failed") { L.push(["err", it.detail === "missing" ? "Datei fehlt." : "ffprobe: moov atom not found"]); return L; }
  step("ATVPREP-STEP 2/2 Bewerten");
  L.push(["", f ? `Zustand: ${STATES[f.state].label} · Kodierbedarf: ${NEEDS[f.need]}` : "Zustand festgehalten."]);
  if (f) f.reasons.forEach((r) => L.push(["", " – " + r]));
  return L;
}
function logHtml(j, it) {
  return `<pre class="log" tabindex="0" aria-label="Protokoll von Eintrag ${it.pos}" data-keep="log">${logOf(j, it).map(([c, t]) => `<span class="${c}">${esc(t)}</span>`).join("\n")}</pre>`;

/* --- Aufträge ausführen (Simulation) --- */
function finishItem(j, it) {
  const f = fileById(it.fid);
  if (!f) { it.status = "failed"; it.detail = "missing"; return; }
  if (f.state === "missing" && j.action !== "prepare") { it.status = "failed"; it.detail = "missing"; return; }
  if (j.action === "prepare") {
    if (needRank({ need: f.trueNeed }) > ALLOWANCE[j.allowance].rank) { it.status = "failed"; it.detail = "encode_not_allowed"; return; }
    it.status = "succeeded"; it.p = 100;
    Object.assign(f, { cont: "mp4", state: "clean", need: "none", change: "none", trueNeed: "none", trueChange: "none", reasons: [], steps: [], subs: 0, checked: Date.now() });
    f.name = f.base + ".mp4"; f.path = `${LIBS[f.lib].root}/${f.folder}/${f.name}`;
    if (f.audio.some((a) => /DTS|TrueHD/.test(a))) f.audio = ["EAC3 5.1 · eng"];
    if (/H\.264 High 10|AV1|Dolby/.test(f.video)) f.video = "HEVC Main10 · " + (f.video.match(/\d{4}p/) || ["1080p"])[0];
    return;
  }
  it.status = "succeeded"; it.p = 100;
  if (f.state === "unknown") {
    const R2 = { f10: ["warning", "patch", [R.dtsfix]], f22: ["embed", "patch", []] }[f.id] || ["clean", "none", []];
    Object.assign(f, { state: R2[0], change: R2[1], trueChange: R2[1], reasons: R2[2], need: "none", trueNeed: "none", video: "H.264 High · 1080p · 24 fps", audio: ["AAC 2.0 · eng"], subs: R2[0] === "embed" ? 1 : 0 });
  } else if (f.need === "unknown") { f.need = f.trueNeed; f.change = f.trueChange; }
  f.checked = Date.now();
}
function settleJob(j) {
  const sts = j.items.map((i) => i.status);
  if (sts.some((s) => ["queued", "running", "claimed", "cancelling"].includes(s))) return false;
  const ok = sts.filter((s) => s === "succeeded").length, bad = sts.filter((s) => s === "failed" || s === "stale_input").length;
  j.finished = Date.now();
  j.status = j.status === "cancel_requested" ? "cancelled" : bad === 0 && ok === sts.length ? "succeeded" : ok > 0 ? "partial_success" : bad > 0 ? "failed" : "cancelled";
  const tone = { succeeded: "success", partial_success: "warning", failed: "danger", cancelled: "info" }[j.status];
  pushEvent("job", `${jobTitle(j)}: ${JSTATUS[j.status][1]}`, tone);
  return true;
}
function tick() {
  let structural = false;
  const parallel = Math.max(1, S.settings.parallelPrepare);
  let runningPrepare = S.jobs.filter((j) => j.action === "prepare").reduce((a, j) => a + j.items.filter((i) => i.status === "running").length, 0);
  S.jobs.slice().reverse().forEach((j) => {
    if (isTerminalJob(j.status)) return;
    if (j.status === "cancel_requested") {
      j.items.forEach((i) => { if (i.status === "queued") i.status = "cancelled"; else if (i.status === "running") i.status = "cancelled"; });
      structural = settleJob(j) || structural; return;
    }
    let cur = j.items.find((i) => i.status === "running");
    if (!cur) {
      const nxt = j.items.find((i) => i.status === "queued");
      if (nxt && (j.action !== "prepare" || runningPrepare < parallel)) {
        nxt.status = "running"; nxt.p = 2; if (!j.started) j.started = Date.now(); j.status = "running"; cur = nxt; structural = true;
        if (j.action === "prepare") runningPrepare++;
      }
    } else {
      const f = fileById(cur.fid);
      const speed = j.action === "prepare" ? (f && f.trueChange === "reencode" ? 3 : 9) : 28;
      cur.p = Math.min(100, cur.p + speed + Math.random() * speed * 0.4);
      if (cur.p >= 100) { finishItem(j, cur); structural = true; if (j.action === "prepare") runningPrepare--; pushEvent("file", `${cur.name}: ${cur.status === "succeeded" ? "weitergekommen" : "fehlgeschlagen"}`, cur.status === "succeeded" ? "success" : "danger"); }
    }
    if (settleJob(j)) structural = true;
  });
  if (structural) { render(); return; }
  patchProgress();
}
function patchProgress() {
  S.jobs.forEach((j) => {
    if (!isActiveJob(j)) return;
    $$(`[data-jp="${j.id}"]`).forEach((e) => { const p = jobProgress(j); e.innerHTML = bar(p, "Fortschritt"); });
    const jd = $(`[data-jd="${j.id}"]`); if (jd) jd.innerHTML = bar(jobProgress(j), "Fortschritt des Auftrags");
    const jt = $(`[data-jt="${j.id}"]`); if (jt && j.started) jt.textContent = fmtDur(Date.now() - j.started);
    j.items.forEach((it) => { const ip = $(`[data-ip="${j.id}:${it.pos}"]`); if (ip && it.status === "running") ip.innerHTML = bar(it.p, "Fortschritt von Eintrag " + it.pos); });
    if (S.jv.logItem && S.jv.active === j.id) { const it = j.items.find((x) => x.pos === S.jv.logItem); const lg = it && $(`[data-lg="${j.id}:${it.pos}"] pre`); if (lg) { const atEnd = lg.scrollTop + lg.clientHeight >= lg.scrollHeight - 4; lg.outerHTML = logHtml(j, it); if (atEnd) { const n = $(`[data-lg="${j.id}:${it.pos}"] pre`); n.scrollTop = n.scrollHeight; } } }
  });
  const run = S.jobs.filter((j) => j.status === "running").length;
  const nc = $("#nav-count"); if (nc) nc.textContent = run || S.jobs.filter((j) => j.status === "queued").length;
}
function cancelJob(id) {
  const j = jobById(id); if (!j || isTerminalJob(j.status)) return;
  j.status = "cancel_requested"; S.jv.confirm = null; toast("info", "Abbruch des Auftrags angefordert."); render();
}
function retryJob(id, o = {}) {
  const j = jobById(id); if (!j) return;
  const items = j.items.filter((i) => ["failed", "stale_input"].includes(i.status) && (!o.only || i.detail === o.only));
  const files = items.map((i) => fileById(i.fid)).filter(Boolean);
  if (!files.length) return;
  const n = enqueue(j.action, files, { trigger: "retry", retryOf: j.id, allowance: o.allowance || j.allowance });
  n.items.forEach((i) => { i.attempt = (items.find((x) => x.fid === i.fid)?.attempt || 1) + 1; });
  S.jv.active = n.id; S.jv.confirm = null;
  toast("success", o.allowance ? "Vorbereiten eingereiht. Der neue Auftrag wird angezeigt." : "Wiederholung eingereiht. Der neue Auftrag wird angezeigt.");
  render();
}

const matchFilter = (f, key) => ({ any: () => true, unknown: () => f.state === "unknown", warning: () => f.state === "warning", blocker: () => f.state === "blocker", "need-audio": () => f.need === "audio", "need-video": () => f.need === "video", convert: () => f.cont !== "mp4" }[key]());

    return preparable(f) && needRank(f) <= ALLOWANCE[s.allowance].rank;
  });
}

}

const simpleToCron = (d) => { const [h, m] = (d.time || "00:00").split(":").map(Number); const days = d.days.length === 7 ? "*" : [...d.days].sort((a, b) => (a || 7) - (b || 7)).join(","); return `${m || 0} ${h || 0} * * ${days || "*"}`; };

}

  const rec = { id: d.id || "s" + (Date.now() % 100000), name: d.name.trim(), action: d.action, lib: d.action === "scan" ? "all" : d.lib, filter: d.action === "scan" ? "any" : d.filter, cron: cronExpr, max: d.action === "scan" ? 0 : Number(d.max), allowance: d.action === "prepare" ? d.allowance : "copy", on: prev ? prev.on : d.action !== "prepare", approved: false, lastRun: prev ? prev.lastRun : null, hist: prev ? prev.hist : [] };
  let msg = rec.on ? "Zeitplan gespeichert und eingeschaltet." : "Zeitplan gespeichert. Er ist pausiert, bis er eingeschaltet wird.";

}

function renderNav() {
  const run = S.jobs.filter((j) => j.status === "running").length, wait = S.jobs.filter((j) => j.status === "queued").length;
  $("#nav").innerHTML = PAGES.map(([id, label, ic]) => `<a href="#${id}" data-page="${id}" ${S.page === id ? 'aria-current="page"' : ""}>${icon(ic, 16)}<span>${label}</span>${id === "aktivitaet" && run + wait ? `<span class="chl chl-badge" role="img" aria-label="${run ? plural(run, "Auftrag läuft", "Aufträge laufen") : plural(wait, "Auftrag wartet", "Aufträge warten")}"><span class="chl-dot${run ? "" : " chl-dot--off"}" aria-hidden="true"></span><span id="nav-count" class="mono" style="font-size:11px">${run || wait}</span></span>` : ""}</a>`).join("");
  $$("#themeseg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.th === S.theme)));
}
function render() {
  const ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const main = $("#main");
  const scrolls = {}; $$("[data-keep]", main).forEach((e) => { scrolls[e.dataset.keep] = [e.scrollTop, e.scrollLeft]; });
  const mainTop = main.scrollTop;
  const page = PAGES.find((p) => p[0] === S.page) || PAGES[0];
  $("#view").innerHTML = page[3]();
  main.scrollTop = mainTop;
  $$("[data-keep]", main).forEach((e) => { const s = scrolls[e.dataset.keep]; if (s) { e.scrollTop = s[0]; e.scrollLeft = s[1]; } });
  renderNav();
  fitFiles();
  document.title = (S.jobs.some((j) => j.status === "running") ? "● " : "") + "atvprep Manager";
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.focus(); try { if (keep.s != null && n.type !== "number") n.setSelectionRange(keep.s, keep.e); } catch (x) { /* Typ ohne Auswahl */ } } }
  if (S.dlg === "prep") { const prep = selectedFiles().filter(preparable); if (prep.length) $("#dlg .dlg").innerHTML = prepBody(prep); }
}
/* Dateien: Unterkante der Arbeitsfläche bündig mit der Unterkante der Darstellungs-Buttons */
function fitFiles() {
  const s = $(".split.files");
  if (!s) return;
  if (innerWidth <= 1180) { s.style.height = ""; return; }
  s.style.height = "";
  const bottom = $("#themeseg").getBoundingClientRect().bottom, top = s.getBoundingClientRect().top;
  s.style.height = Math.max(420, Math.round(bottom - top)) + "px";
}
window.addEventListener("resize", fitFiles);
function go(page, query) {
  if (!PAGES.find((p) => p[0] === page)) page = "dateien";
  S.page = page;
  if (query === "blocker" || query === "warning" || query === "unknown" || query === "probe_failed") { S.fv.states = new Set([query]); S.fv.q = ""; S.fv.props.clear(); S.fv.lib = "all"; }
  if (query === "failed") { S.jv.filter = "failed"; }
  if (location.hash !== "#" + page) history.replaceState(null, "", "#" + page);
  render();
}

/* --- Klick-Aktionen --- */
const ACT = {
  "unconfirm": () => { S.fv.confirm = null; S.jv.confirm = null; S.sv.confirm = null; S.settingsConfirm = false; render(); },
  "dlg-close": () => closeDialog(),
  "goto": (id) => { const [p, q] = id.split("?"); go(p, q); },
  "goto-job": (id) => { S.jv.active = id; go("aktivitaet"); },
  /* Dateien */
  "row": (id, el, ev) => {
    const v = S.fv;
    if (ev.shiftKey && v.anchor) { const ids = visibleFiles().map((f) => f.id), a = ids.indexOf(v.anchor), b = ids.indexOf(id); v.sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1)); }
    else if (ev.metaKey || ev.ctrlKey) { v.sel.has(id) ? v.sel.delete(id) : v.sel.add(id); v.anchor = id; }
    else { v.sel = new Set([id]); v.anchor = id; }
    v.active = id; render();
  },
  "check": (id, el) => { const v = S.fv; el.checked ? v.sel.add(id) : v.sel.delete(id); v.anchor = id; v.active = v.sel.size === 1 ? [...v.sel][0] : v.active; render(); },
  "col": (key, el) => {
    const v = S.fv, d = Number(el.dataset.depth), fid = el.dataset.file;
    if (fid) { v.colPath = v.colPath.slice(0, d); v.sel = new Set([fid]); v.active = fid; v.anchor = fid; }
    else { v.colPath = v.colPath.slice(0, d).concat(key); v.active = null; v.sel = new Set(); }
    render();
    const c = $(".cols"); if (c) c.scrollLeft = c.scrollWidth;
  },
  "sort": (k) => { const v = S.fv; if (v.sort === k) v.dir *= -1; else { v.sort = k; v.dir = 1; } render(); },
  "state": (k) => { const s = S.fv.states; s.has(k) ? s.delete(k) : s.add(k); render(); },
  "prop": (k) => { const s = S.fv.props; s.has(k) ? s.delete(k) : s.add(k); render(); },
  "view": (k) => { S.fv.view = k; render(); },
  "reset-filters": () => { Object.assign(S.fv, { q: "", lib: "all" }); S.fv.states.clear(); S.fv.props.clear(); render(); },
  "clear-sel": () => { S.fv.sel.clear(); S.fv.active = null; render(); },
  "close-insp": () => { S.fv.active = null; S.fv.sel.clear(); render(); },
  "verify-sel": () => verifySelection(),
  "inspect-sel": () => inspectSelection(),
  "prep-open": () => prepDialog(),
  "prep-go": () => prepGo(),
  "copy-path": (id) => copyText(fileById(id).path, "Pfad kopiert."),
  "rm-ask": () => { S.fv.confirm = "rm"; render(); },
  "rm-missing": () => { const n = FILES.filter((f) => f.state === "missing"); n.forEach((f) => FILES.splice(FILES.indexOf(f), 1)); S.fv.confirm = null; toast("success", `${plural(n.length, "fehlende Datei", "fehlende Dateien")} aus „Dateien“ entfernt. Taucht eine Datei bei einem Scan wieder auf, wird sie wieder angezeigt.`); render(); },
  /* Aktivität */
  "jfilter": (k) => { S.jv.filter = k; render(); },
  "job": (id) => { S.jv.active = id; S.jv.confirm = null; S.jv.logItem = null; render(); },
  "log": (pos) => { S.jv.logItem = S.jv.logItem === Number(pos) ? null : Number(pos); render(); },
  "copy-log": (pos) => { const j = jobById(S.jv.active), it = j.items.find((i) => i.pos === Number(pos)); copyText(logOf(j, it).map((l) => l[1]).join("\n"), "Protokoll kopiert."); },
  "cancel-ask": () => { S.jv.confirm = "cancel"; render(); },
  "cancel-go": (id) => cancelJob(id),
  "retry-ask": () => { S.jv.confirm = "retry"; render(); },
  "retry-go": (id) => retryJob(id),
  "raise-ask": () => { S.jv.confirm = "raise"; render(); },
  "raise-go": (id) => retryJob(id, { only: "encode_not_allowed", allowance: S.jv.raise }),
  /* Zeitpläne */
  "sfilter": (k) => { S.sv.filter = k; render(); },
  "sstate": (k) => { S.sv.state = k; render(); },
  "s-reset": () => { S.sv.filter = "all"; S.sv.state = "all"; render(); },
  "s-hist": (id) => { S.sv.openHist = S.sv.openHist === id ? null : id; render(); },
  "s-pause": (id) => { const s = S.schedules.find((x) => x.id === id); s.on = false; s.approved = false; toast("info", s.action === "prepare" ? "Zeitplan pausiert. Die Freigabe ist entzogen." : "Zeitplan pausiert."); render(); },
  "s-on-ask": (id) => { S.sv.confirm = "on:" + id; render(); },
  "s-on": (id) => { const s = S.schedules.find((x) => x.id === id), p = scheduleProblems(s); if (p.length) { toast("danger", `Pausiert: ${p[0]}. Passe den Zeitplan an.`); S.sv.confirm = null; return render(); } s.on = true; s.approved = s.action === "prepare"; S.sv.confirm = null; toast("success", "Zeitplan ist eingeschaltet."); render(); },
  "s-run": (id) => { runSchedule(id); render(); },
  "s-edit": (id) => openSchedDialog(id),
  "s-new": () => openSchedDialog(null),
  "s-dup": (id) => { const s = S.schedules.find((x) => x.id === id), n = { ...s, id: "s" + (Date.now() % 100000), name: s.name + " (Kopie)", on: false, approved: false, hist: [], lastRun: null }; S.schedules.splice(S.schedules.indexOf(s) + 1, 0, n); toast("success", "Zeitplan gespeichert. Er ist pausiert, bis er eingeschaltet wird."); render(); },
  "s-del-ask": (id) => { S.sv.confirm = "del:" + id; render(); },
  "s-del": (id) => { const s = S.schedules.find((x) => x.id === id); S.schedules.splice(S.schedules.indexOf(s), 1); S.sv.confirm = null; toast("success", "Zeitplan gelöscht."); render(); },
  "sd-mode": (m) => { S.sd.mode = m; if (m === "cron") S.sd.cron = simpleToCron(S.sd); else { const x = cronToSimple(S.sd.cron); if (x) { S.sd.time = x.time; S.sd.days = x.days; } } refreshDialog(); },
  "sd-day": (n) => { const d = S.sd, v = Number(n); d.days = d.days.includes(v) ? d.days.filter((x) => x !== v) : d.days.concat(v); refreshDialog(); },
  "sd-preset": (k) => { S.sd.days = { wd: [1, 2, 3, 4, 5], all: [0, 1, 2, 3, 4, 5, 6], we: [6, 0] }[k]; refreshDialog(); },
  "sd-ex": (e) => { S.sd.cron = e; refreshDialog(); },
  "sd-save": () => saveSchedule(),
  /* Übersicht */
  "scan": (id) => startScan(id),
  "orph-ask": () => { S.fv.confirm = "orph"; render(); },
  "orph-go": () => { const n = S.orphans.reduce((a, o) => a + o.count, 0), b = S.orphans.reduce((a, o) => a + o.size, 0); S.orphans = []; S.fv.confirm = null; pushEvent("scan", "Verwaiste Teilüberarbeitungen entfernt", "success"); toast("success", `${plural(n, "verwaiste Teilüberarbeitung", "verwaiste Teilüberarbeitungen")} entfernt (${fmtBytes(b)}).`); render(); },
  /* Einstellungen */
  "st-history": () => { S.showHistory = !S.showHistory; render(); },
  "st-discard": () => { S.draft = { ...S.settings }; S.settingsConfirm = false; render(); },
  "st-save-ask": () => { if (profileDirty()) S.settingsConfirm = true; else { saveSettings(); } render(); },
  "st-save": () => { saveSettings(); render(); },
  /* Shell */
  "theme": (t) => { S.theme = t; applyTheme(); renderNav(); },
  "menu": () => { $("#side").classList.toggle("open"); $("#menubtn").setAttribute("aria-expanded", String($("#side").classList.contains("open"))); },
  "help": () => showHelp(),
  "lock": () => lock(),
  "unlock": () => unlock(),
};
function copyText(text, msg) {
  const done = () => toast("success", msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast("info", "Kopieren war nicht möglich. Markiere den Text und kopiere ihn von Hand."));
  else toast("info", "Kopieren war nicht möglich. Markiere den Text und kopiere ihn von Hand.");
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.type === "checkbox") { ACT[el.dataset.act](el.dataset.id, el, ev); return; }
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === "A") ev.preventDefault(); fn(el.dataset.id, el, ev); }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("tr[data-row]")) { ev.preventDefault(); ACT.row(ev.target.dataset.row, ev.target, ev); }
});

/* --- Eingaben --- */
const INP = {
  fq: (v) => { S.fv.q = v; render(); },
  flib: (v) => { S.fv.lib = v; render(); },
  jq: (v) => { S.jv.q = v; render(); },
  raise: (v) => { S.jv.raise = v; },
  allow: (v) => { S.prepAllow = v; const prep = selectedFiles().filter(preparable); $("#dlg .dlg").innerHTML = prepBody(prep); const r = $(`#dlg input[value="${v}"]`); if (r) r.focus(); },
  "sd-name": (v) => { S.sd.name = v; refreshDialog(); },
  "sd-action": (v) => { S.sd.action = v; S.sd.max = Math.min(S.sd.max, maxFor(S.sd) || 1); if (v === "prepare") { S.sd.max = Math.min(S.sd.max, 12); S.sd.filter = "need-audio"; S.sd.allowance = "audio"; } refreshDialog(); },
  "sd-lib": (v) => { S.sd.lib = v; refreshDialog(); },
  "sd-filter": (v) => { S.sd.filter = v; refreshDialog(); },
  "sd-time": (v) => { S.sd.time = v; refreshDialog(); },
  "sd-cron": (v) => { S.sd.cron = v; refreshDialog(); },
  "sd-max": (v) => { S.sd.max = v === "" ? NaN : Number(v); refreshDialog(); },
  "sd-allow": (v) => { S.sd.allowance = v; refreshDialog(); },
};
function onInput(ev) {
  const el = ev.target.closest("[data-in]");
  if (!el) return;
  const name = el.dataset.in;
  const val = el.type === "checkbox" ? el.checked : el.value;
  if (name.startsWith("st:")) { const k = name.slice(3); S.draft[k] = el.type === "checkbox" ? el.checked : (RANGES[k] ? (el.value === "" ? "" : Number(el.value)) : el.value); S.settingsConfirm = false; render(); return; }
  if (INP[name]) INP[name](val, el);
}
document.addEventListener("input", onInput);
document.addEventListener("change", (ev) => { if (ev.target.tagName === "SELECT" || ev.target.type === "radio" || ev.target.type === "checkbox") onInput(ev); });

/* --- Palette, Hilfe, Sperre --- */
function commands() {
  const c = PAGES.map(([id, l]) => ({ label: `Gehe zu ${l}`, hint: "Seite", run: () => go(id) }));
  [["", "Alle Dateien"], ["clean", "Bereit"], ["warning", "Warnung"], ["blocker", "Blocker"], ["unknown", "Nicht geprüft"], ["probe_failed", "Prüfung fehlgeschlagen"]].forEach(([k, l]) => c.push({ label: `Dateien: ${l} anzeigen`, hint: "Filter", run: () => { S.fv.states = k ? new Set([k]) : new Set(); S.fv.q = ""; go("dateien"); } }));
  c.push({ label: "Aktivität: Fehlgeschlagen in 24 h", hint: "Schnellfilter", run: () => { S.jv.filter = "failed"; go("aktivitaet"); } });
  c.push({ label: "Aktivität: Zeitpläne heute", hint: "Schnellfilter", run: () => { S.jv.filter = "schedule"; go("aktivitaet"); } });
  [["system", "System"], ["light", "Hell"], ["dark", "Dunkel"]].forEach(([k, l]) => c.push({ label: `Darstellung: ${l}`, hint: "Erscheinungsbild", run: () => ACT.theme(k) }));
  c.push({ label: "Tastenkürzel anzeigen", hint: "Hilfe", run: () => showHelp() }, { label: "Manager sperren", hint: "Sitzung", run: () => lock() });
  return c;
}
let palSel = 0, palList = [];
function openPalette() {
  const d = $("#pal");
  d.innerHTML = `<div class="dlg pal"><h2 class="sr">Befehlspalette</h2><input class="chl-input" id="pal-q" type="text" placeholder="Befehl eingeben" aria-label="Befehle suchen" autocomplete="off"><ul role="listbox" id="pal-l" aria-label="Befehle"></ul></div>`;
  if (!d.open) d.showModal();
  palSel = 0; filterPalette(""); $("#pal-q").focus();
}
function filterPalette(q) {
  palList = commands().filter((c) => (c.label + " " + c.hint).toLowerCase().includes(q.toLowerCase()));
  palSel = 0; drawPalette();
}
function drawPalette() {
  $("#pal-l").innerHTML = palList.length ? palList.map((c, i) => `<li><button type="button" role="option" aria-selected="${i === palSel}" data-pi="${i}"><span>${esc(c.label)}</span><span class="hint">${esc(c.hint)}</span></button></li>`).join("") : `<li class="muted" style="padding:var(--space-2)">Kein Befehl gefunden</li>`;
}
function runPalette(i) { const c = palList[i]; if (!c) return; $("#pal").close(); c.run(); }
document.addEventListener("input", (ev) => { if (ev.target.id === "pal-q") filterPalette(ev.target.value); });
document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-pi]"); if (b) runPalette(Number(b.dataset.pi)); });
function showHelp() {
  const rows = [["Überall", [["?", "Diese Tastenkürzel anzeigen"], ["⌘ K", "Befehle öffnen: Seite wechseln, Dateien filtern, Darstellung ändern"], ["Esc", "Offenes Fenster oder Palette schliessen"]]],
    ["Dateien", [["↑ ↓", "Nächste oder vorherige Datei"], ["Shift + Klick", "Auswahl erweitern"], ["⌘ + Klick", "Datei zur Auswahl hinzufügen oder entfernen"], ["V", "Ausgewählte Dateien prüfen"], ["F", "Vorbereiten der ausgewählten Dateien vorab ansehen"]]],
    ["Aktivität", [["↑ ↓", "Nächster oder vorheriger Auftrag"]]]];
  showDialog(`<h2>Tastenkürzel</h2>${rows.map(([t, r]) => `<div class="sec"><h4>${t}:</h4>${r.map(([k, d]) => `<div class="row" style="grid-template-columns:110px minmax(0,1fr)"><span><span class="kbd">${k}</span></span><span>${d}</span></div>`).join("")}</div>`).join("")}<div class="dlg__foot">${btn("Schliessen", { v: "primary", act: "dlg-close" })}</div>`, "help");
}
function lock() { S.locked = true; $("#lock").hidden = false; $("#lock-token").value = ""; $("#lock-token").focus(); $("#app").setAttribute("inert", ""); }
function unlock() { if (!$("#lock-token").value.trim()) { $("#lock-err").hidden = false; return; } S.locked = false; $("#lock").hidden = true; $("#lock-err").hidden = true; $("#app").removeAttribute("inert"); toast("success", "Manager entsperrt."); }
$("#lock-form").addEventListener("submit", (ev) => { ev.preventDefault(); unlock(); });

const isTyping = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
document.addEventListener("keydown", (ev) => {
  if (S.locked) return;
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); const d = $("#pal"); d.open ? d.close() : openPalette(); return; }
  if ($("#pal").open) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); palSel = Math.min(palList.length - 1, palSel + 1); drawPalette(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); palSel = Math.max(0, palSel - 1); drawPalette(); }
    else if (ev.key === "Enter") { ev.preventDefault(); runPalette(palSel); }
    return;
  }
  if ($("#dlg").open || isTyping(ev.target) || ev.altKey) return;
  if (ev.key === "?") { ev.preventDefault(); showHelp(); return; }
  if (S.page === "dateien") {
    const k = ev.key.toLowerCase();
    if (!ev.metaKey && !ev.ctrlKey && k === "v") { ev.preventDefault(); verifySelection(); }
    else if (!ev.metaKey && !ev.ctrlKey && k === "f") { ev.preventDefault(); prepDialog(); }
    else if (ev.key === "Escape") { S.fv.sel.clear(); S.fv.active = null; render(); }
    else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      const ids = visibleFiles().map((f) => f.id); if (!ids.length || S.fv.view !== "list") return;
      ev.preventDefault();
      const i = ids.indexOf(S.fv.active), n = Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : i + (ev.key === "ArrowDown" ? 1 : -1)));
      if (ev.shiftKey) S.fv.sel.add(ids[n]); else S.fv.sel = new Set([ids[n]]);
      S.fv.active = ids[n]; S.fv.anchor = S.fv.anchor || ids[n]; render();
      const r = $(`tr[data-row="${ids[n]}"]`); if (r) { r.scrollIntoView({ block: "nearest" }); r.focus({ preventScroll: true }); }
    }
  } else if (S.page === "aktivitaet" && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    const ids = S.jobs.filter(jobMatches).map((j) => j.id); if (!ids.length) return;
    ev.preventDefault();
    const i = ids.indexOf(S.jv.active), n = Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : i + (ev.key === "ArrowDown" ? 1 : -1)));
    S.jv.active = ids[n]; S.jv.logItem = null; S.jv.confirm = null; render();
  }
});
$("#dlg").addEventListener("close", () => { S.dlg = null; });

/* --- Start --- */
$("#themeseg").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-th]"); if (b) ACT.theme(b.dataset.th); });
$("#menubtn").addEventListener("click", ACT.menu);
$("#nav").addEventListener("click", () => { $("#side").classList.remove("open"); $("#menubtn").setAttribute("aria-expanded", "false"); });
$("#ver").textContent = S.version;
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (p && p !== S.page && PAGES.find((x) => x[0] === p)) { S.page = p; render(); } });
loadTheme(); applyTheme(); seedEvents();
{ const p = location.hash.slice(1); if (PAGES.find((x) => x[0] === p)) S.page = p; }
render();
setInterval(tick, 900);

</script>
